<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d94f2d">
  <title>Мои рецепты — облачная книга</title>
  <style>
    :root{--accent:#d94f2d;--dark:#9e351e;--ink:#20201e;--muted:#706c65;--line:#e7e1d8;--bg:#f8f6f1;--card:#fff;--danger:#b62d2d;--shadow:0 10px 28px rgba(52,38,24,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}header{padding:28px 20px;background:linear-gradient(115deg,#bc3b21,#e96d37);color:#fff}.wrap{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{margin:0;font-size:clamp(1.65rem,4vw,2.35rem);letter-spacing:-.04em}.subtitle{margin:7px 0 0;opacity:.9}.account{display:flex;align-items:center;gap:12px}.email{font-size:.88rem;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.primary,.secondary{border:0;border-radius:10px;padding:10px 14px;font-weight:750;transition:transform .15s}.primary{background:var(--accent);color:#fff}.secondary{background:#eee9e1;color:var(--ink)}header .primary{background:#fff;color:var(--dark)}button:hover:not(:disabled){transform:translateY(-1px)}main{padding:24px 20px 54px}.toolbar{display:grid;grid-template-columns:1fr 205px auto;gap:12px;margin:0 0 22px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,79,45,.14)}textarea{min-height:96px;resize:vertical}.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:260px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.card-image{height:118px;display:grid;place-items:center;background:linear-gradient(135deg,#f3a155,#d95030);background-size:cover;background-position:center;color:#fff;font-size:2.55rem}.card-body{display:flex;flex:1;flex-direction:column;padding:16px}.card h2{margin:0 0 8px;font-size:1.16rem;line-height:1.2}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:.85rem}.tag{padding:3px 8px;border-radius:999px;color:#a44721;background:#fff0e9;font-weight:700;font-size:.77rem}.card p{margin:12px 0;color:var(--muted);line-height:1.45;font-size:.91rem}.card-actions{display:flex;justify-content:space-between;gap:8px;margin-top:auto}.text-button{border:0;background:transparent;color:var(--dark);padding:7px 0;font-weight:750}.favorite{color:#c46b10}.empty{grid-column:1/-1;padding:54px 20px;border:2px dashed #d8d1c8;border-radius:16px;color:var(--muted);text-align:center}.empty h2{color:var(--ink)}dialog{width:min(760px,calc(100% - 28px));max-height:calc(100vh - 28px);padding:0;border:0;border-radius:18px;box-shadow:0 24px 65px rgba(0,0,0,.27)}dialog::backdrop{background:rgba(25,20,15,.55)}.modal{max-height:calc(100vh - 28px);padding:24px;overflow:auto}.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.modal h2{margin:0;font-size:1.42rem}.close{border:0;background:transparent;color:var(--muted);font-size:1.7rem;line-height:1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;margin:0 0 6px;color:#47433e;font-weight:700;font-size:.9rem}.hint{margin:5px 0 0;color:var(--muted);font-size:.8rem}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.detail-photo{width:100%;height:210px;display:grid;place-items:center;margin:0 0 19px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#f3a155,#d95030);background-size:cover;background-position:center;font-size:4rem}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detail h3{margin:0 0 8px;font-size:1rem}.detail ul,.detail ol{margin:0;padding-left:21px;line-height:1.65}.detail-note{padding:12px;border-radius:10px;background:#fff6d7;white-space:pre-wrap;line-height:1.45}.auth-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#ffe7d6,transparent 35%),var(--bg)}.auth-card{width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.auth-card h1{font-size:1.8rem}.auth-card p{color:var(--muted);line-height:1.45}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:22px 0 18px;border-radius:12px;background:#f0ece5}.auth-tab{padding:9px;border:0;border-radius:8px;background:transparent;font-weight:750}.auth-tab.active{color:var(--dark);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}.auth-form{display:grid;gap:13px}.auth-form .primary{width:100%;margin-top:2px}.separator{display:flex;align-items:center;gap:10px;margin:19px 0;color:var(--muted);font-size:.85rem}.separator:before,.separator:after{content:"";height:1px;flex:1;background:var(--line)}.message{display:none;margin:14px 0 0;padding:10px 11px;border-radius:9px;line-height:1.4;font-size:.9rem}.message.show{display:block}.message.success{background:#e8f6ed;color:#1d653d}.message.error{background:#ffe9e7;color:#9b2920}.hidden{display:none!important}@media(max-width:620px){header{padding-top:22px}.top{align-items:flex-start;flex-direction:column}.account{width:100%;justify-content:space-between}.toolbar,.form-grid,.detail-grid{grid-template-columns:1fr}.full{grid-column:auto}.modal-actions{flex-wrap:wrap}.modal-actions>*{flex:1}.email{max-width:190px}}
  </style>
</head>
<body>
  <section class="auth-page" id="authPage"><div class="auth-card"><h1>Мои рецепты</h1><p>Облачная кулинарная книга. Войдите, чтобы рецепты были доступны на всех устройствах.</p><div class="auth-tabs"><button class="auth-tab active" data-auth-mode="login">Войти</button><button class="auth-tab" data-auth-mode="register">Регистрация</button></div><form id="authForm" class="auth-form"><div><label for="authEmail">E-mail</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div><div><label for="authPassword">Пароль</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="Минимум 6 символов"></div><button class="primary" id="passwordSubmit" type="submit">Войти с паролем</button></form><div class="separator">или</div><button class="secondary" id="magicLinkBtn" style="width:100%">Отправить ссылку для входа</button><div id="authMessage" class="message" role="status"></div></div></section>
  <section id="appPage" class="hidden"><header><div class="wrap top"><div><h1>Мои рецепты</h1><p class="subtitle" id="syncStatus">Синхронизация с облаком…</p></div><div class="account"><span class="email" id="userEmail"></span><button id="newRecipe" class="primary">+ Добавить рецепт</button><button id="logoutBtn" class="secondary">Выйти</button></div></div></header><main class="wrap"><div class="toolbar"><input id="search" type="search" placeholder="Поиск по названию и ингредиентам…"><select id="categoryFilter"><option value="">Все категории</option></select><button id="favoritesOnly" class="secondary">☆ Избранное</button></div><section id="recipeList" class="recipes" aria-live="polite"></section></main></section>
  <dialog id="recipeDialog"><form class="modal" id="recipeForm" method="dialog"><div class="modal-header"><h2 id="formTitle">Новый рецепт</h2><button type="button" class="close" data-close aria-label="Закрыть">×</button></div><input id="recipeId" type="hidden"><div class="form-grid"><div class="full"><label for="title">Название *</label><input id="title" maxlength="120" required placeholder="Например, борщ со сметаной"></div><div><label for="category">Категория</label><input id="category" list="categoryList" maxlength="50" placeholder="Например, супы"><datalist id="categoryList"><option>Завтраки</option><option>Супы</option><option>Салаты</option><option>Основные блюда</option><option>Выпечка</option><option>Десерты</option><option>Напитки</option></datalist></div><div><label for="time">Время приготовления, мин.</label><input id="time" type="number" min="0" max="9999" placeholder="Не указано"></div><div><label for="servings">Порций</label><input id="servings" type="number" min="1" max="999" placeholder="Не указано"></div><div><label for="image">Ссылка на фото</label><input id="image" type="url" placeholder="https://…"></div><div class="full"><label for="source">Источник рецепта</label><input id="source" type="url" placeholder="https://…"></div><div class="full"><label for="description">Краткое описание</label><textarea id="description" placeholder="Чем хорош этот рецепт?"></textarea></div><div><label for="ingredients">Ингредиенты *</label><textarea id="ingredients" required placeholder="Один ингредиент на строку&#10;Картофель — 500 г&#10;Морковь — 1 шт."></textarea></div><div><label for="steps">Шаги приготовления *</label><textarea id="steps" required placeholder="Один шаг на строку&#10;Очистить овощи.&#10;Варить 30 минут."></textarea></div><div class="full"><label for="notes">Личная заметка</label><textarea id="notes" placeholder="Например: в следующий раз добавить меньше соли."></textarea></div><div class="full checkline"><input id="favorite" type="checkbox"><label for="favorite" style="margin:0">Добавить в избранное</label></div></div><div class="modal-actions"><button class="secondary" type="button" data-close>Отмена</button><button class="primary" type="submit">Сохранить в облако</button></div></form></dialog>
  <dialog id="detailDialog"><div class="modal detail" id="detailContent"></div></dialog>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL='https://ybkfrftifgpntfppqudd.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_GVUJTtt6xO5HCWRH6_62fw_8GuC2oRd';
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    let currentUser=null,recipes=[],onlyFavorites=false,authMode='login';const $=id=>document.getElementById(id);const escapeHtml=(v='')=>{const d=document.createElement('div');d.textContent=v;return d.innerHTML};const lines=(v='')=>v.split('\n').map(x=>x.trim()).filter(Boolean);const photoStyle=u=>u?`style="background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)),url('${String(u).replace(/'/g,'%27')}')"`:'';const fmtMeta=r=>[r.cooking_time?`${r.cooking_time} мин`:'',r.servings?`${r.servings} порц.`:''].filter(Boolean).map(escapeHtml).join(' · ');
    function msg(t,type='success'){const x=$('authMessage');x.textContent=t;x.className=`message show ${type}`}function status(t){$('syncStatus').textContent=t}function visible(v){$('authPage').classList.toggle('hidden',v);$('appPage').classList.toggle('hidden',!v)}function setMode(m){authMode=m;document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('active',x.dataset.authMode===m));$('passwordSubmit').textContent=m==='login'?'Войти с паролем':'Создать аккаунт';$('authPassword').autocomplete=m==='login'?'current-password':'new-password'}
    function shareText(r){const meta=[r.category?`Категория: ${r.category}`:'',r.cooking_time?`Время приготовления: ${r.cooking_time} мин`:'',r.servings?`Порций: ${r.servings}`:''].filter(Boolean);return [r.title,...meta,r.description||'','Ингредиенты:',...lines(r.ingredients),'','Приготовление:',...lines(r.steps).map((s,i)=>`${i+1}. ${s}`),...(r.notes?['','Заметка:',r.notes]:[])].filter(x=>x!==undefined).join('\n')}
    async function shareRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;const text=shareText(r);try{if(navigator.share){await navigator.share({title:r.title,text});return}if(!navigator.clipboard)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);alert('Текст рецепта скопирован в буфер обмена. Теперь его можно вставить в сообщение.')}catch(err){if(err?.name==='AbortError')return;try{await navigator.clipboard.writeText(text);alert('Текст рецепта скопирован в буфер обмена.')}catch{alert('Не удалось открыть меню отправки. Скопируйте рецепт вручную из окна просмотра.')}}}
    function render(){const q=$('search').value.trim().toLowerCase(),old=$('categoryFilter').value,cats=[...new Set(recipes.map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));$('categoryFilter').innerHTML='<option value="">Все категории</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');$('categoryFilter').value=old;const cat=$('categoryFilter').value,shown=recipes.filter(r=>{const t=[r.title,r.description,r.ingredients,r.category].join(' ').toLowerCase();return(!q||t.includes(q))&&(!cat||r.category===cat)&&(!onlyFavorites||r.is_favorite)}).sort((a,b)=>Number(b.is_favorite)-Number(a.is_favorite)||new Date(b.updated_at)-new Date(a.updated_at));$('recipeList').innerHTML=shown.length?shown.map(r=>`<article class="card"><div class="card-image" ${photoStyle(r.image_url)}>${r.image_url?'':'🍲'}</div><div class="card-body"><h2>${escapeHtml(r.title)} ${r.is_favorite?'<span class="favorite">★</span>':''}</h2><div class="meta">${r.category?`<span class="tag">${escapeHtml(r.category)}</span>`:''}<span>${fmtMeta(r)}</span></div>${r.description?`<p>${escapeHtml(r.description).slice(0,150)}${r.description.length>150?'…':''}</p>`:'<p>Без описания</p>'}<div class="card-actions"><button class="text-button" data-view="${r.id}">Открыть</button><span><button class="text-button" data-edit="${r.id}">Править</button><button class="text-button" data-delete="${r.id}">Удалить</button></span></div></div></article>`).join(''):`<div class="empty"><h2>${recipes.length?'Ничего не найдено':'Здесь пока нет рецептов'}</h2><p>${recipes.length?'Измените поиск или фильтр.':'Нажмите «Добавить рецепт», чтобы создать первую карточку.'}</p></div>`}
    async function load(){status('Загрузка рецептов…');const {data,error}=await supabase.from('recipes').select('*').order('updated_at',{ascending:false});if(error){status('Ошибка загрузки');alert(`Не удалось загрузить рецепты: ${error.message}`);return}recipes=data||[];status('Все изменения сохранены в облаке');render()}function clear(){$('recipeForm').reset();$('recipeId').value='';$('formTitle').textContent='Новый рецепт'}function edit(id){const r=recipes.find(x=>x.id===id);if(!r)return;$('formTitle').textContent='Править рецепт';$('recipeId').value=r.id;$('title').value=r.title||'';$('category').value=r.category||'';$('time').value=r.cooking_time||'';$('servings').value=r.servings||'';$('image').value=r.image_url||'';$('source').value=r.source_url||'';$('description').value=r.description||'';$('ingredients').value=r.ingredients||'';$('steps').value=r.steps||'';$('notes').value=r.notes||'';$('favorite').checked=!!r.is_favorite;$('recipeDialog').showModal()}function detail(id){const r=recipes.find(x=>x.id===id);if(!r)return;$('detailContent').innerHTML=`<div class="modal-header"><div><h2>${escapeHtml(r.title)} ${r.is_favorite?'<span class="favorite">★</span>':''}</h2><div class="meta" style="margin-top:8px">${fmtMeta(r)}</div></div><button class="close" data-detail-close aria-label="Закрыть">×</button></div><div class="detail-photo" ${photoStyle(r.image_url)}>${r.image_url?'':'🍲'}</div>${r.description?`<p style="line-height:1.5;color:var(--muted)">${escapeHtml(r.description)}</p>`:''}<div class="detail-grid"><section><h3>Ингредиенты</h3><ul>${lines(r.ingredients).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section><section><h3>Приготовление</h3><ol>${lines(r.steps).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol></section></div>${r.notes?`<section style="margin-top:21px"><h3>Личная заметка</h3><div class="detail-note">${escapeHtml(r.notes)}</div></section>`:''}<div class="modal-actions"><button class="secondary" data-detail-close>Закрыть</button><button class="secondary" data-share="${r.id}">Поделиться</button>${r.source_url?`<a class="primary" style="text-decoration:none" href="${escapeHtml(r.source_url)}" target="_blank" rel="noopener">Источник</a>`:''}<button class="primary" data-detail-edit="${r.id}">Править</button></div>`;$('detailDialog').showModal()}
    async function auth(e){e.preventDefault();const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password)return;$('passwordSubmit').disabled=true;try{const res=authMode==='login'?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(res.error)throw res.error;if(authMode==='register'&&!res.data.session)msg('Аккаунт создан. Подтвердите e-mail по ссылке из письма, затем войдите.')}catch(err){msg(err.message,'error')}finally{$('passwordSubmit').disabled=false}}async function magic(){const email=$('authEmail').value.trim();if(!email){msg('Сначала введите e-mail.','error');return}$('magicLinkBtn').disabled=true;try{const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;msg('Ссылка для входа отправлена на e-mail. Откройте её на нужном устройстве.')}catch(err){msg(err.message,'error')}finally{$('magicLinkBtn').disabled=false}}
    async function save(e){e.preventDefault();const id=$('recipeId').value,p={user_id:currentUser.id,title:$('title').value.trim(),category:$('category').value.trim()||null,cooking_time:$('time').value?Number($('time').value):null,servings:$('servings').value?Number($('servings').value):null,image_url:$('image').value.trim()||null,source_url:$('source').value.trim()||null,description:$('description').value.trim()||null,ingredients:$('ingredients').value.trim(),steps:$('steps').value.trim(),notes:$('notes').value.trim()||null,is_favorite:$('favorite').checked};status('Сохранение в облако…');const {error}=id?await supabase.from('recipes').update(p).eq('id',id):await supabase.from('recipes').insert(p);if(error){status('Ошибка сохранения');alert(`Не удалось сохранить рецепт: ${error.message}`);return}$('recipeDialog').close();await load()}
    async function onSession(s){currentUser=s?.user||null;if(!currentUser){visible(false);return}visible(true);$('userEmail').textContent=currentUser.email||'';await load()}$('authForm').addEventListener('submit',auth);$('magicLinkBtn').addEventListener('click',magic);document.querySelectorAll('.auth-tab').forEach(x=>x.addEventListener('click',()=>setMode(x.dataset.authMode)));$('newRecipe').addEventListener('click',()=>{clear();$('recipeDialog').showModal()});document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',()=>$('recipeDialog').close()));$('recipeForm').addEventListener('submit',save);$('logoutBtn').addEventListener('click',()=>supabase.auth.signOut());$('search').addEventListener('input',render);$('categoryFilter').addEventListener('change',render);$('favoritesOnly').addEventListener('click',()=>{onlyFavorites=!onlyFavorites;$('favoritesOnly').textContent=onlyFavorites?'★ Все рецепты':'☆ Избранное';$('favoritesOnly').className=onlyFavorites?'primary':'secondary';render()});$('recipeList').addEventListener('click',async e=>{const id=e.target.dataset.view||e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.view)detail(id);if(e.target.dataset.edit)edit(id);if(e.target.dataset.delete){const r=recipes.find(x=>x.id===id);if(r&&confirm(`Удалить рецепт «${r.title}»?`)){const {error}=await supabase.from('recipes').delete().eq('id',id);if(error)alert(error.message);await load()}}});$('detailDialog').addEventListener('click',e=>{if(e.target.dataset.detailClose!==undefined)$('detailDialog').close();if(e.target.dataset.detailEdit){const id=e.target.dataset.detailEdit;$('detailDialog').close();edit(id)}if(e.target.dataset.share)shareRecipe(e.target.dataset.share)});const {data:{session}}=await supabase.auth.getSession();await onSession(session);supabase.auth.onAuthStateChange((_e,s)=>onSession(s));
  </script>
</body>
</html>
